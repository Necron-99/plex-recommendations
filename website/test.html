<!DOCTYPE html>
<html>
<head>
    <title>Plex Recommendations Test</title>
</head>
<body>
    <h1>Plex Recommendations Test</h1>
    <button onclick="testFetch()">Test Fetch Recommendations</button>
    <div id="result"></div>
    
    <script>
        async function testFetch() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                console.log('Starting fetch...');
                const response = await fetch('recommendations.json');
                console.log('Response:', response);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Data:', data);
                
                resultDiv.innerHTML = `
                    <h3>Success!</h3>
                    <p>Total Items: ${data.summary.totalItems}</p>
                    <p>Total Recommendations: ${data.summary.totalRecommendations}</p>
                    <p>ML Recommendations: ${data.summary.mlRecommendations}</p>
                    <h4>General Recommendations:</h4>
                    <ul>
                        ${data.recommendations.general.map(rec => `<li>${rec.suggestion} (${rec.confidence})</li>`).join('')}
                    </ul>
                    <h4>ML Recommendations:</h4>
                    <ul>
                        ${data.recommendations.mlCollaborative.map(rec => `<li>${rec.suggestion} (${rec.confidence})</li>`).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            console.log('Page loaded, starting test...');
            testFetch();
        });
    </script>
</body>
</html>
