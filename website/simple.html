<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Movie Recommendations - Simple Version</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .content {
            padding: 30px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .recommendation-section {
            margin: 30px 0;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .recommendation-item {
            background: #f8f9fa;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .ml-enhanced {
            border-left-color: #4caf50;
            background: #f1f8e9;
        }
        .summary {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Plex Movie Recommendations</h1>
            <p>AI-Powered Personalized Movie Suggestions</p>
        </div>
        
        <div class="content">
            <div id="loading" class="loading" style="display: none;">
                <h3>🔄 Loading recommendations...</h3>
                <p>Analyzing your Plex watch history...</p>
            </div>
            
            <div id="error" class="error" style="display: none;">
                <h3>❌ Error</h3>
                <p id="error-message"></p>
            </div>
            
            <div id="content" style="display: none;">
                <div class="summary" id="summary"></div>
                
                <div class="recommendation-section">
                    <h2>🎯 General Recommendations</h2>
                    <div id="general-recommendations"></div>
                </div>
                
                <div class="recommendation-section">
                    <h2>🤖 ML-Powered Recommendations</h2>
                    <div id="ml-recommendations"></div>
                </div>
                
                <div class="recommendation-section">
                    <h2>📊 ML Analytics</h2>
                    <div id="ml-analytics"></div>
                </div>
            </div>
            
            <div style="text-align: center; margin: 30px 0;">
                <button class="btn" onclick="loadRecommendations()">🔄 Load Recommendations</button>
                <button class="btn" onclick="updateRecommendations()">🔄 Update Recommendations</button>
            </div>
        </div>
    </div>

    <script>
        async function loadRecommendations() {
            showLoading();
            
            try {
                const response = await fetch('recommendations.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayRecommendations(data);
                
            } catch (error) {
                showError(error.message);
            }
        }
        
        async function updateRecommendations() {
            showLoading();
            
            try {
                // Call the update script
                const response = await fetch('/update-recommendations', { method: 'POST' });
                if (!response.ok) {
                    throw new Error('Failed to update recommendations');
                }
                
                // Reload the recommendations
                await loadRecommendations();
                
            } catch (error) {
                // If update fails, just load current recommendations
                console.log('Update failed, loading current recommendations:', error);
                await loadRecommendations();
            }
        }
        
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('content').style.display = 'none';
        }
        
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error-message').textContent = message;
        }
        
        function displayRecommendations(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            
            // Display summary
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <h3>📊 Summary</h3>
                <p><strong>Total Items:</strong> ${data.summary.totalItems} (${data.summary.totalMovies} movies, ${data.summary.totalTVShows} TV episodes)</p>
                <p><strong>Total Recommendations:</strong> ${data.summary.totalRecommendations}</p>
                <p><strong>ML Recommendations:</strong> ${data.summary.mlRecommendations}</p>
                <p><strong>Enriched Items:</strong> ${data.phase2Enhancements.enrichedItemsCount}</p>
            `;
            
            // Display general recommendations
            const generalRecs = document.getElementById('general-recommendations');
            generalRecs.innerHTML = data.recommendations.general.map(rec => `
                <div class="recommendation-item">
                    <h4>${rec.suggestion}</h4>
                    <p>${rec.reason}</p>
                    <small>Confidence: ${(rec.confidence * 100).toFixed(1)}%</small>
                </div>
            `).join('');
            
            // Display ML recommendations
            const mlRecs = document.getElementById('ml-recommendations');
            mlRecs.innerHTML = data.recommendations.mlCollaborative.map(rec => `
                <div class="recommendation-item ml-enhanced">
                    <h4>🤖 ${rec.suggestion}</h4>
                    <p>${rec.reason}</p>
                    <small>Confidence: ${(rec.confidence * 100).toFixed(1)}% | ML Enhanced</small>
                </div>
            `).join('');
            
            // Display ML analytics
            const mlAnalytics = document.getElementById('ml-analytics');
            mlAnalytics.innerHTML = `
                <div class="recommendation-item">
                    <h4>💰 Cost Tracking</h4>
                    <p>Within Budget: ${data.mlEnhancements.costTracking.withinBudget ? '✅ Yes' : '❌ No'}</p>
                    <p>Estimated Monthly Cost: $${data.mlEnhancements.estimatedMonthlyCost}</p>
                    <p>Fallback Mode: ${data.mlEnhancements.fallbackMode ? '⚠️ Active' : '✅ Disabled'}</p>
                </div>
                <div class="recommendation-item">
                    <h4>📈 Performance</h4>
                    <p>Content-Based Recommendations: ${data.mlEnhancements.contentBasedRecommendations}</p>
                    <p>Collaborative Recommendations: ${data.mlEnhancements.collaborativeRecommendations}</p>
                    <p>Hybrid Recommendations: ${data.mlEnhancements.hybridRecommendations}</p>
                </div>
            `;
        }
        
        // Auto-load on page load
        window.addEventListener('load', () => {
            loadRecommendations();
        });
    </script>
</body>
</html>
